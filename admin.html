<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · LBA Certificates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--ink:#12203A;--bg:#EDF0F5;--chalk:#F2B705;--ok:#0F8A5F;--bad:#B3261E;--mute:#5B6780;--line:#D5DBE6;
--head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Public Sans','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font:800 18px var(--head);color:var(--chalk)}
main{max-width:980px;margin:0 auto;padding:28px 20px 60px}
h1,h2{font-family:var(--head);margin:0 0 14px}
h1{font-size:30px}h2{font-size:22px}
.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:6px;font:400 16px var(--body);background:#fff;color:var(--ink)}
textarea{min-height:100px;resize:vertical}
small{color:var(--mute)}
button{padding:11px 18px;border:0;border-radius:6px;background:var(--ink);color:#fff;font:600 15px var(--body);cursor:pointer}
button.alt{background:var(--chalk);color:var(--ink)}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);padding:6px 12px;font-size:14px}
header button{background:transparent;border:2px solid #47597F;color:#fff;padding:6px 12px}
button:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.msg{margin:12px 0 0;font-weight:600;min-height:1.4em}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
#login{max-width:380px;margin:60px auto}
#out{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;border-left:8px solid var(--ok)}
#qrbox canvas{max-width:240px;width:100%;height:auto;border:1px solid var(--line);border-radius:4px}
#out .info{flex:1 1 260px;min-width:0}
#out .info code{display:block;overflow-wrap:anywhere;margin:4px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.id{font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.pill{font-weight:600;font-size:12px;padding:2px 8px;border-radius:99px;background:#DDF3EA;color:var(--ok)}
.pill.rev{background:#F8DEDB;color:var(--bad)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
input,select,button,textarea{min-height:44px}
textarea{min-height:100px}
@media(min-width:1100px){main{max-width:1080px;padding-top:36px}.panel{padding:28px}}
@media(max-width:820px){main{padding:20px 16px 48px}#out{gap:16px}#qrbox{width:100%;text-align:center}#out .info{flex-basis:100%}}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .panel{padding:16px}
  h1{font-size:26px}h2{font-size:20px}
  #cbtn{width:100%}
  #login{margin:28px auto}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}
  td{border:0;padding:3px 0}
  td.id{white-space:normal}
}
</style>
</head>
<body>
<header><b>LBA · Certificate admin</b><button id="logout" type="button" hidden>Sign out</button></header>
<main>
  <section id="login" class="panel">
    <h1>Sign in</h1>
    <form id="lf">
      <label for="pw">Admin password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <p class="msg" id="lmsg" role="alert"></p>
      <button id="lbtn" type="submit">Sign in</button>
    </form>
  </section>

  <div id="app" hidden>
    <section class="panel">
      <h2>Issue a certificate</h2>
      <form id="cf" class="grid" autocomplete="off">
        <div><label for="name">Full name</label><input id="name" maxlength="100" required></div>
        <div><label for="inst">College / school</label><input id="inst" maxlength="150" required></div>
        <div><label for="type">Work type</label>
          <select id="type" required><option>Internship</option><option>Volunteer</option><option>Member</option><option>Others</option></select></div>
        <div><label for="domain">Domain</label><input id="domain" maxlength="100" placeholder="e.g. Web development" required></div>
        <div class="full" id="otherWrap" hidden><label for="otherType">Type your work type</label><input id="otherType" maxlength="60" placeholder="e.g. Hackathon participant"></div>
        <div><label for="start">Start date</label><input id="start" type="date" required></div>
        <div><label for="end">End date <small>(leave empty if ongoing)</small></label><input id="end" type="date"></div>
        <div class="full"><label for="title">Title</label><input id="title" maxlength="150" required></div>
        <div class="full"><label for="desc">Description</label><textarea id="desc" maxlength="1500" required></textarea></div>
        <div class="full"><label for="skills">Skills <small>(comma separated)</small></label><input id="skills" maxlength="300" placeholder="HTML, CSS, Teamwork" required></div>
        <div class="full"><button id="cbtn" type="submit">Generate certificate &amp; QR</button><p class="msg" id="cmsg" role="alert"></p></div>
      </form>
    </section>

    <section id="out" class="panel" hidden>
      <div id="qrbox"></div>
      <div class="info">
        <h2>QR ready</h2>
        <small>Certificate ID</small><code id="oid"></code>
        <small>Verification link</small><code id="olink"></code>
        <div class="row">
          <button id="dl" class="alt" type="button">Download QR (PNG)</button>
          <button id="cp" class="ghost" type="button">Copy link</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>All certificates</h2>
      <p class="msg" id="tmsg"></p>
      <div class="tw"><table>
        <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
  </div>
</main>

<script>
const API_URL    = 'https://script.google.com/macros/s/AKfycby-fUWL8BvDO-2NcqUHQAcRbqrISohW27yuSJu0k7uWb6B3LhnrDqB4G86F7FHgygRN/exec';                      // Apps Script /exec URL
const VERIFY_URL = 'https://lastbenchersassociation.github.io/verify/index.html'; // public URL of index.html

const $ = id => document.getElementById(id);
const TK = 'lba_token';
let qrCanvas = null, qrId = '';

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function note(id, text, kind){ const n = $(id); n.textContent = text; n.className = 'msg' + (kind ? ' ' + kind : ''); }
const verifyLink = id => VERIFY_URL + '?id=' + encodeURIComponent(id);

async function api(action, data){
  if (API_URL.startsWith('PASTE')) throw new Error('Set API_URL in admin.html first.');
  let res;
  try{
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, token: sessionStorage.getItem(TK) }, data || {})) });
  }catch(e){ throw new Error('Could not reach the server. Check your connection.'); }
  let json;
  try{ json = await res.json(); }catch(e){ throw new Error('Unexpected server response. Check the deployment settings.'); }
  if (!json.success){
    if (json.code === 'AUTH'){ showLogin(); }
    throw new Error(json.error || 'Request failed');
  }
  return json.data;
}

function showLogin(){
  sessionStorage.removeItem(TK);
  $('app').hidden = true; $('logout').hidden = true; $('login').hidden = false;
}
async function showApp(){
  $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false;
  await loadList();
}

/* ---------- auth ---------- */
$('lf').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('lbtn'); b.disabled = true; note('lmsg', 'Signing in…');
  try{
    const r = await api('login', { password: $('pw').value });
    sessionStorage.setItem(TK, r.token); $('pw').value = ''; note('lmsg', '');
    await showApp();
  }catch(err){ note('lmsg', err.message, 'err'); }
  finally{ b.disabled = false; }
});
$('logout').addEventListener('click', async () => {
  try{ await api('logout'); }catch(e){}
  showLogin();
});

/* ---------- QR ---------- */
function makeQR(text, id){
  const q = qrcode(0, 'Q'); q.addData(text); q.make();
  const n = q.getModuleCount(), s = Math.max(4, Math.floor(480 / n)), pad = 32, size = n * s + pad * 2, foot = 46;
  const c = document.createElement('canvas'); c.width = size; c.height = size + foot;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#12203A';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(pad + k * s, pad + r * s, s, s);
  x.textAlign = 'center'; x.font = 'bold 22px monospace';
  x.fillText(id, size / 2, size + 8);
  x.font = '14px sans-serif'; x.fillText('Scan to verify · Last Benchers Association', size / 2, size + 32);
  return c;
}
function showQR(id){
  const link = verifyLink(id);
  qrCanvas = makeQR(link, id); qrId = id;
  $('qrbox').replaceChildren(qrCanvas);
  $('oid').textContent = id; $('olink').textContent = link;
  $('out').hidden = false; $('out').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
$('dl').addEventListener('click', () => {
  if (!qrCanvas) return;
  const a = document.createElement('a'); a.href = qrCanvas.toDataURL('image/png'); a.download = qrId + '.png';
  document.body.appendChild(a); a.click(); a.remove();
});
$('cp').addEventListener('click', async () => {
  const link = $('olink').textContent;
  try{ await navigator.clipboard.writeText(link); $('cp').textContent = 'Copied'; setTimeout(() => $('cp').textContent = 'Copy link', 1500); }
  catch(e){ prompt('Copy this link:', link); }
});

/* ---------- issue ---------- */
$('start').addEventListener('change', () => { $('end').min = $('start').value; });
function toggleOther(){
  const on = $('type').value === 'Others';
  $('otherWrap').hidden = !on; $('otherType').required = on;
  if (!on) $('otherType').value = '';
  else $('otherType').focus();
}
$('type').addEventListener('change', toggleOther);
$('cf').addEventListener('submit', async e => {
  e.preventDefault();
  if (VERIFY_URL.includes('YOUR-USERNAME')){ note('cmsg', 'Set VERIFY_URL in admin.html to your GitHub Pages index.html address.', 'err'); return; }
  const b = $('cbtn'); b.disabled = true; note('cmsg', 'Saving…');
  try{
    const rec = await api('addCertificate', {
      name: $('name').value, institution: $('inst').value, workType: $('type').value, otherType: $('otherType').value,
      startDate: $('start').value, endDate: $('end').value, domain: $('domain').value,
      title: $('title').value, description: $('desc').value, skills: $('skills').value });
    note('cmsg', 'Certificate saved.', 'ok');
    $('cf').reset(); $('end').min = ''; toggleOther();
    showQR(rec.ID); await loadList();
  }catch(err){ note('cmsg', err.message, 'err'); }
  finally{ b.disabled = false; }
});

/* ---------- list ---------- */
async function loadList(){
  note('tmsg', 'Loading…');
  try{
    const list = await api('listCertificates');
    const body = $('rows'); body.replaceChildren();
    note('tmsg', list.length ? '' : 'No certificates yet. Issue the first one above.');
    list.forEach(r => {
      const tr = el('tr'), rev = r.Status === 'Revoked';
      const st = el('td'); st.appendChild(el('span', 'pill' + (rev ? ' rev' : ''), r.Status));
      const act = el('td'), box = el('div', 'row'); act.appendChild(box);
      const qr = el('button', 'ghost', 'QR'); qr.type = 'button'; qr.onclick = () => showQR(r.ID);
      const op = el('button', 'ghost', 'Open'); op.type = 'button'; op.onclick = () => window.open(verifyLink(r.ID), '_blank', 'noopener');
      const tg = el('button', 'ghost', rev ? 'Restore' : 'Revoke'); tg.type = 'button';
      tg.onclick = async () => {
        if (!rev && !confirm('Revoke ' + r.ID + '? It will show as no longer valid.')) return;
        tg.disabled = true;
        try{ await api('setStatus', { id: r.ID, status: rev ? 'Active' : 'Revoked' }); await loadList(); }
        catch(err){ note('tmsg', err.message, 'err'); tg.disabled = false; }
      };
      box.append(qr, op, tg);
      tr.append(el('td', 'id', r.ID), el('td', '', r.Name), el('td', '', r.WorkType), st, act);
      body.appendChild(tr);
    });
  }catch(err){ note('tmsg', err.message, 'err'); }
}

/* ---------- boot ---------- */
(async () => {
  if (!sessionStorage.getItem(TK)) return;
  try{ await api('checkSession'); await showApp(); }catch(e){ showLogin(); }
})();
</script>
</body>
</html>
